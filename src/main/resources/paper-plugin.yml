name: AuroraKits
version: '${version}'
main: club.aurorapvp.AuroraKits
api-version: 1.19
authors: [ Villagers654 ]
description: A Crystal PvP Kits Plugin for the Aurora Network
website: aurorapvp.club
commands:
  aurorakits:
    description: AuroraKits admin plugin commands
    usage: /aurorakits
    permission: aurorakits.admin
  kit:
    description: Opens a kit
    usage: /kit [name]
    permission: aurorakits.kit
  kits:
    description: Opens the Kit GUI
    usage: /kits
    permission: aurorakits.kit
  frames:
    description: Manages AuroraKits frames
    usage: /createframe [name]
    permission: aurorakits.frame
permissions:
  aurorakits.kit:
    description: Allows the use of kits
    default: true
  aurorakits.admin:
    description: Allows for the use of admin commands
    default: op
  aurorakits.frames:
    description: Allows for the creation of frames
    default: op