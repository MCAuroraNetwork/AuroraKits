name: AuroraKits
version: '${version}'
main: club.aurorapvp.aurorakits.AuroraKits
api-version: '1.20'
authors: [ Villagers654 ]
description: A Crystal PvP Kits Plugin for the Aurora Network
website: aurorapvp.club
commands:
permissions:
  aurorakits.command.aurorakits:
    default: false
    children:
      aurorakits.command.aurorakits.reload: false
      aurorakits.command.aurorakits.help: true

  aurorakits.command.aurorakits.reload:
    default: false
  aurorakits.command.aurorakits.help:
    default: false

  aurorakits.command.kit:
    default: false
    children:
      aurorakits.command.kit.create: true
      aurorakits.command.kit.delete: true
      aurorakits.command.kit.edit: true
      aurorakits.command.kit.createpublic: false
      aurorakits.command.kit.deletepublic: false
      aurorakits.command.kit.help: true
  aurorakits.command.kit.create:
    default: false
  aurorakits.command.kit.delete:
    default: false
  aurorakits.command.kit.createpublic:
    default: false
  aurorakits.command.kit.deletepublic:
    default: false
  aurorakits.command.kit.edit:
    default: false
  aurorakits.command.kit.help:
    default: false

  aurorakits.command.kits:
    default: true

  aurorakits.command.frames:
    default: false
    children:
      aurorakits.command.frames.create: true
      aurorakits.command.frames.delete: true
  aurorakits.command.frames.create:
    default: false
  aurorakits.command.frames.delete:
    default: false

  aurorakits.default:
    description: Allows for basic AuroraKits functionality
    default: true
    children:
      aurorakits.command.aurorakits: true

  aurorakits.kits:
    description: Allows for use of all kit commands
    default: true
    children:
      aurorakits.command.kit: true

  aurorakits.frames:
    description: Allows for use of all frame commands
    default: op
    children:
      aurorakits.command.frames: true

  aurorakits.publickits:
    description: Allows for creation and deletion of public kits
    default: op
    children:
      aurorakits.command.kit.createpublic: true
      aurorakits.command.kit.deletepublic: true

  aurorakits.admin:
    description: Allows for the use of admin commands
    default: op
    children:
      aurorakits.command.aurorakits.reload: true

dependencies:
  server:
    AuroraCombat:
      required: false