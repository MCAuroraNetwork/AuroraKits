name: AuroraKits
version: '${version}'
main: club.aurorapvp.aurorakits.AuroraKits
api-version: '1.19'
authors: [ Villagers654 ]
description: A Crystal PvP Kits Plugin for the Aurora Network
website: aurorapvp.club
commands:
  aurorakits:
    description: AuroraKits admin plugin commands
    usage: /aurorakits
    permission: aurorakits.admin
  kit:
    description: Opens a kit
    usage: /kit [name]
    permission: aurorakits.kit
  kits:
    description: Opens the Kit GUI
    usage: /kits
    permission: aurorakits.kit
  frames:
    description: Manages AuroraKits frames
    usage: /createframe [name]
    permission: aurorakits.frame
permissions:
  aurorakits.command.aurorakits:
    default: false
  aurorakits.command.kit:
    default: false
  aurorakits.command.kits:
    default: false
  aurorakits.command.frames:
    default: false
  aurorakits.admin:
    description: Allows for the use of admin commands
    default: op
    children:
      aurorakits.command.frames: true
      aurorakits.command.aurorakits: true
  aurorakits.kit:
    description: Allows the use of kits
    default: true
    children:
      aurorakits.command.kit: true
      aurorakits.command.kits: true
  aurorakits.default:
    description: Allows for the use of basic commands
    default: true
    children:
      aurorakits.command.aurorakits: true